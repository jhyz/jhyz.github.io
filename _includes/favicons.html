{% assign favicon_path = '/assets/img/favicons' | relative_url %}
<!-- A versioned URL refreshes browsers that cached the former theme icon. -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ favicon_path }}/favicon-32x32.png?v=20261101">
<link rel="icon" type="image/png" sizes="96x96" href="{{ favicon_path }}/favicon-96x96.png?v=20261101">
<link rel="shortcut icon" href="{{ favicon_path }}/favicon.ico?v=20261101">
<link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_path }}/apple-touch-icon.png?v=20261101">
{% if site.pwa.enabled %}
<link rel="manifest" href="{{ favicon_path }}/site.webmanifest">
{% endif %}
