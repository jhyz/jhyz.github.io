name: Build and Deploy Chirpy
on:
  push:
    branches: [main, 'codex/chirpy-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Build production site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check internal links
        run: bundle exec htmlproofer _site --disable-external
      - name: Check publication boundaries
        run: python3 tests/check_site.py _site
      - name: Save preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: chirpy-preview
          path: _site
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
